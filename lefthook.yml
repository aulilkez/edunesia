pre-commit:
  parallel: true
  commands:
    staged-check:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: vp check --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commit:
      run: >-
        grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' {1}

pre-push:
  commands:
    static-checks:
      run: vp check --no-fmt
    tests:
      run: vp test run

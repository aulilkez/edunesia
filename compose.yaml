services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edunesia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - edunesia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edunesia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  edunesia-postgres:
